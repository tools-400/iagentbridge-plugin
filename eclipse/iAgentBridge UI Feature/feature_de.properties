# feature.properties
# contains externalized strings for feature.xml
# "%foo" in feature.xml corresponds to the key "foo" in this file
# java.io.Properties file (ISO 8859-1 with "\" escapes)
# This file should be translated.

# "description" property - description of the feature
description=\
Für Entwickler von RDi-Plug-ins: lässt KI-Agenten wie Claude Code die Oberfläche einer \
Testinstanz von RDi lesen, die aus dem Arbeitsbereich gestartet wurde - den Widget-Baum als Text \
mit dem Werkzeug "ui_snapshot" und Bildschirmfotos mit dem Werkzeug "ui_screenshot". Die \
Werkzeuge arbeiten nur in einer Testinstanz mit -Diagentbridge.uiTools=true; das RDi, in dem der \
Entwickler arbeitet, leitet sie dorthin weiter. Setzt iAgentBridge derselben oder einer neueren Version voraus.

