Description_preference_page=Settings of the UI tools, with which an agent reads and operates a test instance of RDi.

Label_Dialogs_of_the_test_instance=Dialogs, that an action opens in the test instance
Label_Dialogs_background=In the background: put them behind all other windows (they flicker briefly)
Label_Dialogs_foreground=In the foreground: let them lie on top of the other windows
Note_Setting_is_forwarded=The RDi, in which you work, passes this setting to the test instance with every call of a UI tool. In the test instance it applies to calls on its own port.
