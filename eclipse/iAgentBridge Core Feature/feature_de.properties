# "%foo" in feature.xml corresponds to the key "foo" in this file
# java.io.Properties file (ISO 8859-1 with "\" escapes)
# This file should be translated.

# "description" property - description of the feature
description=\
Lässt KI-Agenten wie Claude Code Funktionen von RDi nutzen, mit den Einstellungen, die in RDi \
gelten.\n\
\n\
"iAgentBridge" betreibt in RDi einen Server des Model Context Protocol (MCP). Er bietet die \
Werkzeuge:\n\
- Clean Up: führt "Source > Clean Up" auf Java-Dateien aus, mit dem Bereinigungsprofil des \
Projekts oder des Arbeitsbereichs.\n\
- Arbeitsbereichsinformationen: sagt dem Agenten, mit welchem RDi, Arbeitsbereich und welchen \
Java-Projekten er spricht.\n\
\n\
Der Server horcht nur auf 127.0.0.1 und verlangt ein Token. Port und Token werden auf der \
Benutzervorgabenseite "iAgentBridge" eingestellt.

