# feature.properties
# contains externalized strings for feature.xml
# "%foo" in feature.xml corresponds to the key "foo" in this file
# java.io.Properties file (ISO 8859-1 with "\" escapes)
# This file should be translated.

# "description" property - description of the feature
description=\
Lets AI agents like Claude Code use functions of RDi, with the settings that apply in RDi.\n\
\n\
"iAgentBridge" runs a server of the Model Context Protocol (MCP) inside RDi. It offers the \
tools:\n\
- Clean Up: runs "Source > Clean Up" on Java files with the clean-up profile of the project or \
of the workspace.\n\
- Workspace information: tells the agent, which RDi, workspace and Java projects it talks to.\n\
\n\
The server listens on 127.0.0.1 only and requires a token. Port and token are set on the \
preference page "iAgentBridge".

